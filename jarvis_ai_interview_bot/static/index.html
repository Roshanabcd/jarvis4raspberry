<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS OS — AI Interview Bot</title>
  <style>
    :root {
      --bg: #050a12;
      --panel: #0b1320;
      --panel-2: #0f192b;
      --border: #173b3a;
      --text: #e6f1ff;
      --muted: #8ea3bd;
      --accent: #00f5d4;
      --emerald: #10b981;
      --blue: #38bdf8;
      --amber: #f59e0b;
      --mono: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px 20px;
      background: linear-gradient(180deg, #091220 0%, #050a12 100%);
      border-bottom: 1px solid var(--border);
    }
    .brand-title { font-weight: 800; letter-spacing: 0.08em; color: var(--accent); font-size: 1.05rem; }
    .brand-sub { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
    .pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .pill {
      font-size: 0.74rem; padding: 4px 10px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--panel); font-weight: 600;
    }
    .pill.ok { border-color: var(--emerald); color: #6ee7b7; }
    .pill.med { border-color: var(--blue); color: #7dd3fc; }

    .layout { display: grid; grid-template-columns: 270px 1fr; flex: 1; min-height: 0; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

    aside {
      background: var(--panel); border-right: 1px solid var(--border);
      padding: 14px; display: flex; flex-direction: column; gap: 10px;
      overflow-y: auto; max-height: calc(100vh - 68px);
    }
    .side-title {
      font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--accent); display: flex; justify-content: space-between; align-items: center;
    }
    .sess-item {
      padding: 8px 10px; border-radius: 8px; border: 1px solid #17273b;
      background: #07101c; cursor: pointer; font-size: 0.78rem;
    }
    .sess-item:hover { border-color: var(--accent); }

    main { padding: 18px 22px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .field { flex: 1; min-width: 160px; }
    label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 4px; }
    input, select, textarea {
      width: 100%; background: #060d18; color: var(--text);
      border: 1px solid #1e324a; border-radius: 8px; padding: 9px 11px;
      font-family: var(--sans); font-size: 0.86rem;
    }
    textarea { min-height: 130px; resize: vertical; }
    .btn {
      background: linear-gradient(90deg, #00d4b8, #10b981); color: #031214;
      border: none; border-radius: 8px; padding: 9px 16px; font-weight: 700;
      font-size: 0.85rem; cursor: pointer;
    }
    .btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
    .btn:disabled { opacity: 0.55; cursor: wait; }
    .question-box {
      padding: 14px; border-radius: 10px; background: #071322;
      border: 1px solid var(--accent); font-size: 0.96rem; line-height: 1.5;
    }
    .eval-box {
      padding: 12px; border-radius: 10px; background: #07101d;
      border: 1px solid #1f3349; font-size: 0.84rem; display: flex; flex-direction: column; gap: 6px;
    }
    .score-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .metric {
      background: #060e1a; border: 1px solid #183049; border-radius: 8px; padding: 10px; text-align: center;
    }
    .metric-val { font-size: 1.35rem; font-weight: 800; color: var(--accent); }
    .metric-lbl { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    pre {
      margin: 0; background: #04080f; border: 1px solid #182a40; border-radius: 8px;
      padding: 14px; overflow-x: auto; font-family: var(--mono); font-size: 0.8rem;
      line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    }
    .hidden { display: none !important; }
    .small-muted { font-size: 0.78rem; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand-title">JARVIS OS — AI INTERVIEW BOT</div>
      <div class="brand-sub">Education &amp; Learning • Adaptive Technical &amp; Behavioral Interview Simulator</div>
    </div>
    <div class="pills">
      <span class="pill ok" id="health-pill">Backend: Checking...</span>
      <span class="pill med" id="provider-pill">Provider: ...</span>
      <span class="pill med">MEDIUM</span>
      <span class="pill ok">AVAILABLE</span>
    </div>
  </header>

  <div class="layout">
    <aside>
      <div class="side-title">
        <span>Past Sessions</span>
        <button class="btn secondary" style="padding:4px 8px;font-size:0.72rem;" onclick="loadSessions()">Refresh</button>
      </div>
      <div id="sessions-list" style="display:flex;flex-direction:column;gap:8px;"></div>
    </aside>

    <main>
      <!-- SETUP CARD -->
      <section class="card" id="setup-card">
        <strong style="color:var(--accent);">Start New Interview Simulation</strong>
        <div class="row">
          <div class="field">
            <label>Candidate Name</label>
            <input id="cand-name" value="Roshan" />
          </div>
          <div class="field" style="flex:2;">
            <label>Target Role</label>
            <select id="cand-role">
              <option>Python / Backend Engineer</option>
              <option>AI / ML Engineer</option>
              <option>Robotics / Embedded Systems Engineer</option>
              <option>Full-Stack Software Engineer</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>Interview Mode</label>
            <select id="cand-mode">
              <option value="mixed">Mixed (Technical + Behavioral)</option>
              <option value="technical">Technical Only</option>
              <option value="behavioral">Behavioral Only (STAR)</option>
            </select>
          </div>
          <div class="field">
            <label>Starting Difficulty</label>
            <select id="cand-diff">
              <option value="Junior">Junior</option>
              <option value="Mid" selected>Mid</option>
              <option value="Senior">Senior</option>
            </select>
          </div>
          <div class="field">
            <label>Questions</label>
            <select id="cand-count">
              <option value="3">3 Questions (Quick)</option>
              <option value="5" selected>5 Questions (Standard)</option>
              <option value="8">8 Questions (Full Loop)</option>
            </select>
          </div>
        </div>
        <div class="row">
          <button class="btn" onclick="startInterview(this)">Start Live Interview</button>
        </div>
      </section>

      <!-- ACTIVE INTERVIEW CARD -->
      <section class="card hidden" id="live-card">
        <div class="row" style="justify-content:space-between;">
          <strong style="color:var(--accent);" id="live-header">Question 1</strong>
          <span class="small-muted" id="live-badges"></span>
        </div>
        <div class="question-box" id="live-question"></div>
        <div>
          <label>Your Answer</label>
          <textarea id="live-answer" placeholder="Explain your architecture, trade-offs, or STAR story clearly..."></textarea>
        </div>
        <div class="row">
          <button class="btn" onclick="submitAnswer(this)">Submit Answer &amp; Evaluate</button>
        </div>
        <div id="last-eval" class="eval-box hidden"></div>
      </section>

      <!-- FINAL REPORT CARD -->
      <section class="card hidden" id="report-card">
        <div class="row" style="justify-content:space-between;">
          <strong style="color:var(--accent);" id="rep-title">Final Interview Feedback Report</strong>
          <div class="row">
            <button class="btn secondary" onclick="downloadReport()">Download .md Report</button>
          </div>
        </div>
        <div class="score-grid" id="rep-scores"></div>
        <pre id="rep-md"></pre>
      </section>
    </main>
  </div>

  <script>
    const API = "/api/interview-bot";
    let activeSessionId = null;
    let totalQuestions = 5;

    async function apiFetch(path, options = {}) {
      const res = await fetch(API + path, {
        headers: { "Content-Type": "application/json" },
        ...options
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Request failed");
      return data;
    }

    async function loadHealth() {
      try {
        const h = await apiFetch("/health");
        document.getElementById("health-pill").textContent = "Backend OK";
        document.getElementById("provider-pill").textContent = "AI: " + h.provider;
      } catch {
        document.getElementById("health-pill").textContent = "Backend Error";
      }
    }

    async function loadSessions() {
      const el = document.getElementById("sessions-list");
      try {
        const data = await apiFetch("/sessions?limit=20");
        if (!data.sessions.length) {
          el.innerHTML = "<div class='small-muted'>No interview sessions yet.</div>";
          return;
        }
        el.innerHTML = data.sessions.map(s => `
          <div class="sess-item" onclick="openReport(${s.id})">
            <div style="color:var(--accent);font-weight:700;">#${s.id} • ${s.status.toUpperCase()}</div>
            <div>${s.role}</div>
            <div class="small-muted">${s.answered_count}/${s.total_questions} Qs • Score: ${s.overall_score ?? "—"}</div>
          </div>
        `).join("");
      } catch {
        el.innerHTML = "<div class='small-muted'>Unable to load sessions.</div>";
      }
    }

    async function startInterview(btn) {
      btn.disabled = true;
      try {
        const data = await apiFetch("/sessions/start", {
          method: "POST",
          body: JSON.stringify({
            candidate_name: document.getElementById("cand-name").value,
            role: document.getElementById("cand-role").value,
            mode: document.getElementById("cand-mode").value,
            difficulty: document.getElementById("cand-diff").value,
            total_questions: Number(document.getElementById("cand-count").value)
          })
        });
        activeSessionId = data.session_id;
        totalQuestions = data.total_questions;
        document.getElementById("live-card").classList.remove("hidden");
        document.getElementById("report-card").classList.add("hidden");
        document.getElementById("last-eval").classList.add("hidden");
        renderQuestion(data.current_question);
        loadSessions();
      } catch (err) { alert(err.message); } finally { btn.disabled = false; }
    }

    function renderQuestion(q) {
      document.getElementById("live-header").textContent = `Question ${q.turn_number} of ${totalQuestions}`;
      document.getElementById("live-badges").textContent = `${q.category.toUpperCase()} • ${q.difficulty}`;
      document.getElementById("live-question").textContent = q.question;
      document.getElementById("live-answer").value = "";
    }

    async function submitAnswer(btn) {
      const answer = document.getElementById("live-answer").value.trim();
      if (answer.length < 5) { alert("Please write a fuller answer before submitting."); return; }
      btn.disabled = true;
      try {
        const data = await apiFetch(`/sessions/${activeSessionId}/answer`, {
          method: "POST",
          body: JSON.stringify({ answer })
        });
        const ev = data.evaluation;
        const evalEl = document.getElementById("last-eval");
        evalEl.classList.remove("hidden");
        evalEl.innerHTML = `
          <div><strong style="color:var(--accent);">Turn ${ev.turn_number} Score: ${ev.rubric.overall_score}/100</strong>
            (Accuracy ${ev.rubric.accuracy_depth} • Clarity ${ev.rubric.structure_clarity} • Problem-Solving ${ev.rubric.problem_solving} • Completeness ${ev.rubric.completeness})
          </div>
          <div><strong>Coaching Tip:</strong> ${ev.coaching_tip}</div>
        `;
        if (data.status === "completed") {
          document.getElementById("live-card").classList.add("hidden");
          await openReport(activeSessionId);
        } else if (data.next_question) {
          renderQuestion(data.next_question);
        }
        loadSessions();
      } catch (err) { alert(err.message); } finally { btn.disabled = false; }
    }

    async function openReport(sessionId) {
      activeSessionId = sessionId;
      try {
        const rep = await apiFetch(`/sessions/${sessionId}/report`);
        document.getElementById("report-card").classList.remove("hidden");
        document.getElementById("rep-title").textContent = `Report #${rep.session_id} — ${rep.verdict}`;
        document.getElementById("rep-scores").innerHTML = `
          <div class="metric"><div class="metric-val">${rep.overall_score}</div><div class="metric-lbl">Overall Score</div></div>
          <div class="metric"><div class="metric-val">${rep.average_rubric.accuracy_depth}</div><div class="metric-lbl">Accuracy &amp; Depth</div></div>
          <div class="metric"><div class="metric-val">${rep.average_rubric.structure_clarity}</div><div class="metric-lbl">Structure &amp; Clarity</div></div>
          <div class="metric"><div class="metric-val">${rep.average_rubric.problem_solving}</div><div class="metric-lbl">Problem-Solving</div></div>
          <div class="metric"><div class="metric-val">${rep.average_rubric.completeness}</div><div class="metric-lbl">Completeness</div></div>
        `;
        document.getElementById("rep-md").textContent = rep.report_markdown;
      } catch (err) { alert(err.message); }
    }

    function downloadReport() {
      if (activeSessionId) window.location.href = `${API}/sessions/${activeSessionId}/export`;
    }

    loadHealth();
    loadSessions();
  </script>
</body>
</html>
