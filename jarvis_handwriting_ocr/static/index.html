<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS OS — Handwritten to Text Converter</title>
  <style>
    :root {
      --bg: #050a12;
      --panel: #0b1320;
      --panel-2: #0f1b2d;
      --border: #173b3a;
      --accent: #00f5d4;
      --accent-2: #10b981;
      --text: #e6f1ff;
      --muted: #8aa4bf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: radial-gradient(circle at top right, #0b1d2e 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 19, 32, 0.92);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand h1 { margin: 0; font-size: 18px; color: var(--accent); letter-spacing: 0.5px; }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: rgba(0, 245, 212, 0.1);
      color: var(--accent);
    }
    main { max-width: 1180px; margin: 22px auto; padding: 0 20px 40px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab-btn.active {
      background: rgba(0, 245, 212, 0.14);
      color: var(--accent);
      border-color: var(--accent);
    }
    .panel {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .panel.active { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
    }
    canvas {
      background: #ffffff;
      border: 2px solid var(--accent);
      border-radius: 10px;
      cursor: crosshair;
      touch-action: none;
      width: 100%;
      max-width: 760px;
      height: 260px;
      display: block;
      margin-bottom: 12px;
    }
    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #031318;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      margin-right: 8px;
    }
    button.secondary {
      background: var(--panel-2);
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 8px;
    }
    .card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
    }
    .status { font-size: 13px; color: var(--accent); margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>JARVIS OS // Handwritten to Text Converter</h1>
      <span class="badge">IMAGE UPLOAD · LIVE DRAWING PAD · OCR</span>
    </div>
    <div id="healthBadge" class="badge">Loading...</div>
  </header>

  <main>
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('upload', this)">Upload Handwritten Photo</button>
      <button class="tab-btn" onclick="showTab('canvas', this)">Live Handwriting Pad</button>
      <button class="tab-btn" onclick="showTab('history', this)">Conversion History</button>
    </div>

    <section id="tab-upload" class="panel active">
      <div class="grid">
        <div>
          <label>Select Handwritten Note Image (PNG, JPG, WEBP)</label>
          <input id="fileInput" type="file" accept="image/*" />
        </div>
        <div>
          <label>OCR Language (Tesseract code)</label>
          <select id="langSelect">
            <option value="eng" selected>English (eng)</option>
            <option value="nep">Nepali (nep)</option>
            <option value="hin">Hindi (hin)</option>
            <option value="eng+nep">English + Nepali (eng+nep)</option>
          </select>
        </div>
        <div>
          <label>Vision LLM Mode (if OPENROUTER_API_KEY set)</label>
          <select id="visionMode">
            <option value="false" selected>Local Tesseract Offline</option>
            <option value="true">OpenRouter Vision LLM (Best for cursive)</option>
          </select>
        </div>
      </div>
      <button class="primary" onclick="convertUploaded()">Convert Image to Text</button>
      <div id="uploadStatus" class="status"></div>
      <div id="resultBox"></div>
    </section>

    <section id="tab-canvas" class="panel">
      <label>Write with mouse, touch, or stylus below:</label>
      <canvas id="drawCanvas" width="760" height="260"></canvas>
      <div>
        <button class="primary" onclick="convertCanvas()">Convert Drawing to Text</button>
        <button class="secondary" onclick="clearCanvas()">Clear Pad</button>
      </div>
      <div id="canvasStatus" class="status"></div>
      <div id="canvasResult"></div>
    </section>

    <section id="tab-history" class="panel">
      <button class="primary" onclick="loadHistory()">Refresh History</button>
      <div id="historyList"></div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("drawCanvas");
    const ctx = canvas.getContext("2d");
    let drawing = false;

    function clearCanvas() {
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    clearCanvas();

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height),
      };
    }

    function startDraw(e) {
      drawing = true;
      const p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.strokeStyle = "#111111";
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
    }
    function moveDraw(e) {
      if (!drawing) return;
      e.preventDefault();
      const p = getPos(e);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    function endDraw() { drawing = false; }

    canvas.addEventListener("mousedown", startDraw);
    canvas.addEventListener("mousemove", moveDraw);
    window.addEventListener("mouseup", endDraw);
    canvas.addEventListener("touchstart", startDraw);
    canvas.addEventListener("touchmove", moveDraw, { passive: false });
    window.addEventListener("touchend", endDraw);

    function showTab(name, btn) {
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("tab-" + name).classList.add("active");
      btn.classList.add("active");
      if (name === "history") loadHistory();
    }

    async function refreshHealth() {
      try {
        const res = await fetch("/api/handwriting-ocr/health");
        const d = await res.json();
        document.getElementById("healthBadge").textContent =
          `OK | Tesseract: ${d.backends.local_tesseract ? "YES" : "NO"} | ${d.total_conversions} conversions`;
      } catch (e) {
        document.getElementById("healthBadge").textContent = "Backend unreachable";
      }
    }

    function renderResult(targetId, d) {
      document.getElementById(targetId).innerHTML = `
        <div class="card">
          <div style="font-size:12px;color:#8aa4bf;">
            Engine: <strong>${d.engine_used}</strong> | Confidence: <strong>${d.confidence}%</strong> |
            ${d.word_count} words | ${d.latency_ms} ms
          </div>
          <textarea rows="6" style="margin-top:10px;" readonly>${d.cleaned_text}</textarea>
          <div>
            <a href="/api/handwriting-ocr/history/${d.id}/export?fmt=txt" style="color:#00f5d4;margin-right:14px;">Download .TXT</a>
            <a href="/api/handwriting-ocr/history/${d.id}/export?fmt=md" style="color:#10b981;">Download .MD</a>
          </div>
        </div>
      `;
    }

    function readDataUrl(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    async function runConvert(filename, dataUrl, statusId, resultId) {
      document.getElementById(statusId).textContent = "Running handwriting OCR...";
      const res = await fetch("/api/handwriting-ocr/convert", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          filename,
          image_base64: dataUrl,
          language: document.getElementById("langSelect").value,
          use_vision_llm: document.getElementById("visionMode").value === "true",
        }),
      });
      const d = await res.json();
      if (!res.ok) {
        document.getElementById(statusId).textContent = `Error: ${d.detail || res.statusText}`;
        return;
      }
      document.getElementById(statusId).textContent = `Converted #${d.id} (${d.width}x${d.height}px).`;
      renderResult(resultId, d);
      refreshHealth();
    }

    async function convertUploaded() {
      const f = document.getElementById("fileInput").files[0];
      if (!f) {
        document.getElementById("uploadStatus").textContent = "Please choose an image file first.";
        return;
      }
      const dataUrl = await readDataUrl(f);
      await runConvert(f.name, dataUrl, "uploadStatus", "resultBox");
    }

    async function convertCanvas() {
      const dataUrl = canvas.toDataURL("image/png");
      await runConvert("canvas_handwriting.png", dataUrl, "canvasStatus", "canvasResult");
    }

    async function loadHistory() {
      const res = await fetch("/api/handwriting-ocr/history");
      const d = await res.json();
      document.getElementById("historyList").innerHTML = (d.items || []).map(it => `
        <div class="card">
          <strong>#${it.id} — ${it.filename}</strong>
          <span style="font-size:12px;color:#8aa4bf;"> (${it.engine_used} | ${it.word_count} words | ${it.confidence}%)</span>
          <div style="margin-top:6px;white-space:pre-wrap;font-size:13px;">${it.cleaned_text}</div>
        </div>
      `).join("") || `<div class="card">No conversions yet.</div>`;
    }

    refreshHealth();
  </script>
</body>
</html>
