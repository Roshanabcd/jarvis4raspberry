<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS OS — Smart Resume Matching</title>
  <style>
    :root {
      --bg: #050a12;
      --panel: #0b1320;
      --panel-2: #0f1b2d;
      --border: #173b3a;
      --accent: #00f5d4;
      --accent-2: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --text: #e6f1ff;
      --muted: #8aa4bf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: radial-gradient(circle at top right, #0b1d2e 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 19, 32, 0.92);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand h1 { margin: 0; font-size: 18px; color: var(--accent); letter-spacing: 0.5px; }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: rgba(0, 245, 212, 0.1);
      color: var(--accent);
    }
    main { max-width: 1180px; margin: 22px auto; padding: 0 20px 40px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab-btn.active {
      background: rgba(0, 245, 212, 0.14);
      color: var(--accent);
      border-color: var(--accent);
    }
    .panel {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .panel.active { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
    }
    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #031318;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    .card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
    }
    .pill-ok {
      display: inline-block;
      padding: 2px 8px;
      margin: 2px;
      border-radius: 6px;
      font-size: 11px;
      background: rgba(16, 185, 129, 0.18);
      color: var(--accent-2);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .pill-gap {
      display: inline-block;
      padding: 2px 8px;
      margin: 2px;
      border-radius: 6px;
      font-size: 11px;
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .status { font-size: 13px; color: var(--accent); margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>JARVIS OS // Smart Resume Matching</h1>
      <span class="badge">SKILL EXTRACTION · SCORING · SEMANTIC GAP ANALYSIS</span>
    </div>
    <div id="healthBadge" class="badge">Loading...</div>
  </header>

  <main>
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('match', this)">Match Resume vs JD</button>
      <button class="tab-btn" onclick="showTab('jobs', this)">Saved Jobs &amp; Leaderboards</button>
    </div>

    <section id="tab-match" class="panel active">
      <div class="grid">
        <div>
          <label>Candidate Name</label>
          <input id="candName" placeholder="e.g. Roshan Sharma" />
        </div>
        <div>
          <label>Saved Job ID (optional — overrides inline JD)</label>
          <input id="matchJobId" placeholder="Leave blank for inline JD below" />
        </div>
      </div>
      <div class="grid">
        <div>
          <label>Candidate Resume Text</label>
          <textarea id="resumeText" rows="7" placeholder="Paste candidate resume text..."></textarea>
        </div>
        <div>
          <label>Job Description (if no Job ID)</label>
          <textarea id="jdText" rows="7" placeholder="Paste job description..."></textarea>
        </div>
      </div>
      <button class="primary" onclick="runMatch()">Score &amp; Analyze Gaps</button>
      <div id="matchStatus" class="status"></div>
      <div id="matchOutput"></div>
    </section>

    <section id="tab-jobs" class="panel">
      <div class="grid">
        <div>
          <label>Job Title</label>
          <input id="jobTitle" placeholder="Robotics & AI Systems Engineer" />
        </div>
        <div>
          <label>Company</label>
          <input id="jobCompany" value="JARVIS Labs" />
        </div>
        <div>
          <label>Min Years Experience</label>
          <input id="jobYears" type="number" step="0.5" value="2" />
        </div>
      </div>
      <label>Required Skills (comma-separated, optional — auto-extracted if empty)</label>
      <input id="jobReqSkills" placeholder="python, fastapi, sqlite, ros2, raspberry pi" />
      <label>Job Description</label>
      <textarea id="jobDesc" rows="4" placeholder="Describe the role, stack, and responsibilities..."></textarea>
      <button class="primary" onclick="createJob()">Save Job Profile</button>
      <div id="jobStatus" class="status"></div>
      <div id="jobsList"></div>
    </section>
  </main>

  <script>
    function showTab(name, btn) {
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("tab-" + name).classList.add("active");
      btn.classList.add("active");
      if (name === "jobs") loadJobs();
    }

    async function refreshHealth() {
      try {
        const res = await fetch("/api/resume-matching/health");
        const d = await res.json();
        document.getElementById("healthBadge").textContent =
          `OK | ${d.total_jobs} jobs | ${d.total_evaluations} evaluations`;
      } catch (e) {
        document.getElementById("healthBadge").textContent = "Backend unreachable";
      }
    }

    async function runMatch() {
      const jid = document.getElementById("matchJobId").value.trim() || null;
      const payload = {
        candidate_name: document.getElementById("candName").value.trim(),
        resume_text: document.getElementById("resumeText").value.trim(),
        job_id: jid,
        job_description: jid ? null : document.getElementById("jdText").value.trim(),
      };
      const res = await fetch("/api/resume-matching/match", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      const d = await res.json();
      if (!res.ok) {
        document.getElementById("matchStatus").textContent = `Error: ${d.detail || res.statusText}`;
        return;
      }
      document.getElementById("matchStatus").textContent =
        `Overall Score: ${d.overall_score}/100 (${d.recommendation_tier.toUpperCase()})`;
      const matched = d.matched_required_skills.map(s => `<span class="pill-ok">${s}</span>`).join("") || "None";
      const missing = d.missing_required_skills.map(s => `<span class="pill-gap">${s}</span>`).join("") || "None";
      const gaps = d.gap_recommendations.map(g => `<li>${g}</li>`).join("");
      document.getElementById("matchOutput").innerHTML = `
        <div class="card">
          <div><strong>${d.candidate_name}</strong> -> <strong>${d.job_title}</strong></div>
          <div style="font-size:12px;color:#8aa4bf;margin-top:6px;">
            Required Skills: ${d.required_skill_score}% | Semantic: ${d.semantic_similarity}% | Experience: ${d.experience_score}% (${d.candidate_years_experience} yrs, ${d.candidate_education})
          </div>
          <div style="margin-top:10px;"><strong>Matched Required:</strong> ${matched}</div>
          <div style="margin-top:6px;"><strong>Missing Required:</strong> ${missing}</div>
          <h4 style="color:#00f5d4;margin:12px 0 6px;">Gap Analysis &amp; Recommendations</h4>
          <ul>${gaps}</ul>
        </div>
      `;
      refreshHealth();
    }

    async function createJob() {
      const payload = {
        title: document.getElementById("jobTitle").value.trim(),
        company: document.getElementById("jobCompany").value.trim() || "Internal",
        min_years_experience: Number(document.getElementById("jobYears").value) || 0,
        required_skills: document.getElementById("jobReqSkills").value.split(",").map(s => s.trim()).filter(Boolean),
        description: document.getElementById("jobDesc").value.trim(),
      };
      const res = await fetch("/api/resume-matching/jobs", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      const d = await res.json();
      document.getElementById("jobStatus").textContent = res.ok
        ? `Saved Job '${d.title}' (ID: ${d.job_id}, ${d.required_skills.length} required skills).`
        : `Error: ${d.detail || res.statusText}`;
      refreshHealth();
      loadJobs();
    }

    async function loadJobs() {
      const res = await fetch("/api/resume-matching/jobs");
      const d = await res.json();
      document.getElementById("jobsList").innerHTML = (d.jobs || []).map(j => `
        <div class="card">
          <strong>${j.title}</strong> (${j.company}) — ID: <code>${j.job_id}</code>
          <div style="font-size:12px;color:#8aa4bf;margin-top:4px;">
            Min Exp: ${j.min_years_experience} yrs | Required: ${j.required_skills.join(", ")}
          </div>
        </div>
      `).join("") || `<div class="card">No saved jobs yet.</div>`;
    }

    refreshHealth();
  </script>
</body>
</html>
