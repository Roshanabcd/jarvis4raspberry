<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS OS — End-to-End AI Search Engine</title>
  <style>
    :root {
      --bg: #050a12;
      --panel: #0b1320;
      --panel-2: #0f1b2d;
      --border: #173b3a;
      --accent: #00f5d4;
      --accent-2: #10b981;
      --text: #e6f1ff;
      --muted: #8aa4bf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: radial-gradient(circle at top right, #0b1d2e 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 19, 32, 0.92);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand h1 { margin: 0; font-size: 18px; color: var(--accent); letter-spacing: 0.5px; }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: rgba(0, 245, 212, 0.1);
      color: var(--accent);
    }
    main { max-width: 1180px; margin: 22px auto; padding: 0 20px 40px; }
    .tabs, .chips { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab-btn, .chip {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .tab-btn.active, .chip.active {
      background: rgba(0, 245, 212, 0.14);
      color: var(--accent);
      border-color: var(--accent);
    }
    .panel {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .panel.active { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
    }
    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #031318;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    .card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
    }
    .synth {
      background: rgba(0, 245, 212, 0.06);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 14px;
      margin-top: 14px;
      line-height: 1.5;
    }
    .pill {
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-2);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .status { font-size: 13px; color: var(--accent); margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>JARVIS OS // End-to-End AI Search Engine</h1>
      <span class="badge">HYBRID 128-D + BM25 RRF</span>
    </div>
    <div id="healthBadge" class="badge">Loading...</div>
  </header>

  <main>
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('search', this)">Unified Search</button>
      <button class="tab-btn" onclick="showTab('ingest', this)">Index Source / Directory</button>
      <button class="tab-btn" onclick="showTab('sources', this)">Sources &amp; History</button>
    </div>

    <section id="tab-search" class="panel active">
      <div class="chips" id="filterChips">
        <button class="chip active" data-type="" onclick="selectFilter(this)">All Sources</button>
        <button class="chip" data-type="document" onclick="selectFilter(this)">Documents</button>
        <button class="chip" data-type="codebase" onclick="selectFilter(this)">Codebases</button>
        <button class="chip" data-type="terminal_log" onclick="selectFilter(this)">Terminal Logs</button>
        <button class="chip" data-type="web_knowledge" onclick="selectFilter(this)">Web Knowledge</button>
      </div>
      <input id="qInput" placeholder="Search across local docs, Python/JS codebases, terminal logs, and web notes..." />
      <button class="primary" onclick="runSearch()">Search Everything</button>
      <div id="qStatus" class="status"></div>
      <div id="qSynth"></div>
      <div id="qHits"></div>
    </section>

    <section id="tab-ingest" class="panel">
      <div class="grid">
        <div>
          <label>Source Type</label>
          <select id="srcType">
            <option value="document">document</option>
            <option value="codebase">codebase</option>
            <option value="terminal_log">terminal_log</option>
            <option value="web_knowledge">web_knowledge</option>
          </select>
        </div>
        <div>
          <label>Title</label>
          <input id="srcTitle" placeholder="e.g. jarvis_voice.py or daemon.log" />
        </div>
        <div>
          <label>Source URI / Path / URL</label>
          <input id="srcUri" placeholder="local://jarvis-os/voice.py or https://..." />
        </div>
      </div>
      <label>Tags (comma-separated)</label>
      <input id="srcTags" placeholder="voice, raspberry-pi, error" />
      <label>Content</label>
      <textarea id="srcContent" rows="5" placeholder="Paste code, logs, documentation, or web knowledge..."></textarea>
      <button class="primary" onclick="indexItem()">Index Item</button>
      <div id="ingestStatus" class="status"></div>

      <hr style="border-color:#173b3a;margin:22px 0;" />
      <label>Index Local Directory (within JARVIS_SEARCH_ALLOWED_ROOTS)</label>
      <input id="dirPath" placeholder="/path/to/workspace/subdir" />
      <button class="primary" onclick="indexDir()">Crawl &amp; Index Directory</button>
      <div id="dirStatus" class="status"></div>
    </section>

    <section id="tab-sources" class="panel">
      <button class="primary" onclick="loadSourcesAndHistory()">Refresh</button>
      <div id="sourcesList"></div>
      <h3 style="color:#00f5d4;margin-top:24px;">Recent Search History</h3>
      <div id="historyList"></div>
    </section>
  </main>

  <script>
    let activeFilter = "";

    function showTab(name, btn) {
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("tab-" + name).classList.add("active");
      btn.classList.add("active");
      if (name === "sources") loadSourcesAndHistory();
    }

    function selectFilter(btn) {
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      activeFilter = btn.dataset.type || "";
    }

    async function refreshHealth() {
      try {
        const res = await fetch("/api/ai-search/health");
        const d = await res.json();
        document.getElementById("healthBadge").textContent =
          `OK | ${d.total_sources} sources | ${d.total_chunks} chunks | ${d.embedding_dim}D`;
      } catch (e) {
        document.getElementById("healthBadge").textContent = "Backend unreachable";
      }
    }

    async function runSearch() {
      const payload = {
        query: document.getElementById("qInput").value.trim(),
        source_types: activeFilter ? [activeFilter] : [],
        top_k: 8,
        synthesize_answer: true,
      };
      const res = await fetch("/api/ai-search/query", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      document.getElementById("qStatus").textContent =
        `${data.total_hits} hits in ${data.latency_ms} ms (${data.synthesis_mode})`;
      document.getElementById("qSynth").innerHTML = data.synthesized_answer
        ? `<div class="synth"><strong>Synthesized Answer:</strong><br/>${data.synthesized_answer}</div>`
        : "";
      document.getElementById("qHits").innerHTML = (data.hits || []).map(h => `
        <div class="card">
          <strong>${h.title}</strong> <span class="pill">${h.source_type}</span> <span class="pill">${h.location}</span>
          <div style="font-size:12px;color:#8aa4bf;margin-top:4px;">
            URI: ${h.source_uri} | RRF: ${h.rrf_score} | Sem: ${h.semantic_score} | BM25: ${h.lexical_score}
          </div>
          <div style="margin-top:8px;font-size:13px;">${h.snippet}</div>
        </div>
      `).join("");
    }

    async function indexItem() {
      const payload = {
        source_type: document.getElementById("srcType").value,
        title: document.getElementById("srcTitle").value.trim(),
        source_uri: document.getElementById("srcUri").value.trim() || "local://inline",
        content: document.getElementById("srcContent").value.trim(),
        tags: document.getElementById("srcTags").value.split(",").map(s => s.trim()).filter(Boolean),
      };
      const res = await fetch("/api/ai-search/index", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      document.getElementById("ingestStatus").textContent = res.ok
        ? `Indexed '${data.title}' (${data.source_type}, ${data.chunk_count} chunks).`
        : `Error: ${data.detail || res.statusText}`;
      refreshHealth();
    }

    async function indexDir() {
      const res = await fetch("/api/ai-search/index-directory", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ directory: document.getElementById("dirPath").value.trim() }),
      });
      const data = await res.json();
      document.getElementById("dirStatus").textContent = res.ok
        ? `Indexed ${data.indexed_files} files (skipped ${data.skipped_files}) from ${data.directory}.`
        : `Error: ${data.detail || res.statusText}`;
      refreshHealth();
    }

    async function loadSourcesAndHistory() {
      const [sRes, hRes] = await Promise.all([
        fetch("/api/ai-search/sources"),
        fetch("/api/ai-search/history"),
      ]);
      const sData = await sRes.json();
      const hData = await hRes.json();
      document.getElementById("sourcesList").innerHTML = sData.sources.map(s => `
        <div class="card">
          <strong>${s.title}</strong> <span class="pill">${s.source_type}</span>
          <div style="font-size:12px;color:#8aa4bf;margin-top:4px;">${s.source_uri} | ${s.chunk_count} chunks | ID: ${s.item_id}</div>
        </div>
      `).join("") || `<div class="card">No sources indexed yet.</div>`;
      document.getElementById("historyList").innerHTML = hData.history.map(h => `
        <div class="card">
          <strong>${h.query}</strong> <span class="pill">${h.source_filter}</span>
          <div style="font-size:12px;color:#8aa4bf;margin-top:4px;">${h.result_count} hits · ${h.latency_ms} ms</div>
        </div>
      `).join("") || `<div class="card">No queries recorded yet.</div>`;
    }

    refreshHealth();
  </script>
</body>
</html>
