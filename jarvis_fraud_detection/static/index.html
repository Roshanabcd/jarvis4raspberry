<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS OS — Fraud Detection System</title>
  <style>
    :root {
      --bg: #050a12;
      --panel: #0b1320;
      --panel-2: #0f1b2d;
      --border: #173b3a;
      --accent: #00f5d4;
      --accent-2: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --text: #e6f1ff;
      --muted: #8aa4bf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: radial-gradient(circle at top right, #181123 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 19, 32, 0.92);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand h1 { margin: 0; font-size: 18px; color: var(--accent); letter-spacing: 0.5px; }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: rgba(0, 245, 212, 0.1);
      color: var(--accent);
    }
    main { max-width: 1180px; margin: 22px auto; padding: 0 20px 40px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab-btn.active {
      background: rgba(0, 245, 212, 0.14);
      color: var(--accent);
      border-color: var(--accent);
    }
    .panel {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .panel.active { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
    }
    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #031318;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    button.small {
      background: var(--panel);
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      margin-right: 6px;
    }
    .card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
    }
    .sev-critical { color: var(--danger); font-weight: 700; }
    .sev-high { color: var(--warn); font-weight: 700; }
    .sev-medium { color: #38bdf8; font-weight: 700; }
    .sev-low { color: var(--accent-2); font-weight: 700; }
    .status { font-size: 13px; color: var(--accent); margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>JARVIS OS // Fraud Detection System</h1>
      <span class="badge">TRANSACTIONS · AUTH LOGS · AUDIT ENTRIES</span>
    </div>
    <div id="healthBadge" class="badge">Loading...</div>
  </header>

  <main>
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('analyze', this)">Analyze Event</button>
      <button class="tab-btn" onclick="showTab('alerts', this)">Alert Triage Queue</button>
      <button class="tab-btn" onclick="showTab('summary', this)">Risk Analytics</button>
    </div>

    <section id="tab-analyze" class="panel active">
      <div class="grid">
        <div>
          <label>Stream Type</label>
          <select id="evStream">
            <option value="transaction">transaction</option>
            <option value="auth_log">auth_log</option>
            <option value="audit_entry">audit_entry</option>
          </select>
        </div>
        <div>
          <label>Actor / Account ID</label>
          <input id="evActor" value="acct_roshan" />
        </div>
        <div>
          <label>Action</label>
          <input id="evAction" value="wire_transfer" />
        </div>
        <div>
          <label>Status</label>
          <select id="evStatus">
            <option value="success">success</option>
            <option value="failed">failed</option>
            <option value="denied">denied</option>
          </select>
        </div>
        <div>
          <label>Amount (optional, transactions)</label>
          <input id="evAmount" type="number" step="0.01" placeholder="e.g. 4200.00" />
        </div>
        <div>
          <label>Geo Country (ISO-2)</label>
          <input id="evGeo" value="NP" />
        </div>
        <div>
          <label>IP Address</label>
          <input id="evIp" value="192.168.1.25" />
        </div>
        <div>
          <label>Device ID</label>
          <input id="evDevice" value="rpi5-jarvis-01" />
        </div>
      </div>
      <button class="primary" onclick="scoreEvent()">Evaluate Anomaly Risk</button>
      <div id="evStatusMsg" class="status"></div>
      <div id="evResult"></div>
    </section>

    <section id="tab-alerts" class="panel">
      <button class="primary" onclick="loadAlerts()">Refresh Alerts</button>
      <div id="alertsList"></div>
    </section>

    <section id="tab-summary" class="panel">
      <button class="primary" onclick="loadSummary()">Refresh Summary</button>
      <div id="summaryBox"></div>
    </section>
  </main>

  <script>
    function showTab(name, btn) {
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("tab-" + name).classList.add("active");
      btn.classList.add("active");
      if (name === "alerts") loadAlerts();
      if (name === "summary") loadSummary();
    }

    async function refreshHealth() {
      try {
        const res = await fetch("/api/fraud-detection/health");
        const d = await res.json();
        document.getElementById("healthBadge").textContent =
          `OK | ${d.total_events} events | ${d.open_alerts} open alerts`;
      } catch (e) {
        document.getElementById("healthBadge").textContent = "Backend unreachable";
      }
    }

    async function scoreEvent() {
      const amtRaw = document.getElementById("evAmount").value.trim();
      const payload = {
        stream_type: document.getElementById("evStream").value,
        actor_id: document.getElementById("evActor").value.trim(),
        action: document.getElementById("evAction").value.trim(),
        status: document.getElementById("evStatus").value,
        amount: amtRaw ? Number(amtRaw) : null,
        geo_country: document.getElementById("evGeo").value.trim() || null,
        ip_address: document.getElementById("evIp").value.trim() || null,
        device_id: document.getElementById("evDevice").value.trim() || null,
      };
      const res = await fetch("/api/fraud-detection/events", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      const d = await res.json();
      if (!res.ok) {
        document.getElementById("evStatusMsg").textContent = `Error: ${d.detail || res.statusText}`;
        return;
      }
      document.getElementById("evStatusMsg").textContent =
        `Scored Event #${d.id} — Risk ${d.risk_score}/100 | Decision: ${d.decision.toUpperCase()}`;
      const sigs = (d.signals || []).map(s => `<li><strong>${s.code}</strong> (+${s.weight}): ${s.detail}</li>`).join("");
      document.getElementById("evResult").innerHTML = `
        <div class="card">
          <div>Severity: <span class="sev-${d.severity}">${d.severity.toUpperCase()}</span> | Alert ID: ${d.alert_id || "none"}</div>
          <ul>${sigs || "<li>No anomaly signals triggered.</li>"}</ul>
        </div>
      `;
      refreshHealth();
    }

    async function loadAlerts() {
      const res = await fetch("/api/fraud-detection/alerts");
      const d = await res.json();
      document.getElementById("alertsList").innerHTML = (d.alerts || []).map(a => `
        <div class="card">
          <div>
            <strong>Alert #${a.id}</strong> (${a.stream_type}) — Actor: <strong>${a.actor_id}</strong> |
            Risk: <span class="sev-${a.severity}">${a.risk_score} (${a.severity.toUpperCase()})</span> |
            Status: <strong>${a.status}</strong>
          </div>
          <ul>${a.signals.map(s => `<li><strong>${s.code}</strong>: ${s.detail}</li>`).join("")}</ul>
          <div>
            <button class="small" onclick="setAlert(${a.id}, 'resolved')">Mark Resolved</button>
            <button class="small" onclick="setAlert(${a.id}, 'false_positive')">False Positive</button>
          </div>
        </div>
      `).join("") || `<div class="card">No alerts generated yet.</div>`;
    }

    async function setAlert(id, status) {
      await fetch(`/api/fraud-detection/alerts/${id}`, {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ status, analyst_note: "Updated via JARVIS dashboard" }),
      });
      refreshHealth();
      loadAlerts();
    }

    async function loadSummary() {
      const res = await fetch("/api/fraud-detection/summary");
      const d = await res.json();
      const actors = (d.top_risky_actors || []).map(a =>
        `<li><strong>${a.actor_id}</strong> — ${a.event_count} events, max risk ${a.max_risk_score}, avg ${a.avg_risk_score}</li>`
      ).join("");
      document.getElementById("summaryBox").innerHTML = `
        <div class="card">
          <div>Total Events: <strong>${d.total_events}</strong> | Total Alerts: <strong>${d.total_alerts}</strong> | Open Alerts: <strong>${d.open_alerts}</strong></div>
          <div style="margin-top:8px;color:#8aa4bf;">By Stream: ${JSON.stringify(d.by_stream_type)} | By Severity: ${JSON.stringify(d.by_severity)}</div>
          <h4 style="color:#00f5d4;margin-bottom:6px;">Top Risky Actors</h4>
          <ul>${actors || "<li>No actor activity yet.</li>"}</ul>
        </div>
      `;
    }

    refreshHealth();
  </script>
</body>
</html>
