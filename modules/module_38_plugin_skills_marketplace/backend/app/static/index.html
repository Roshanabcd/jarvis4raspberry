<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS OS — Plugin &amp; Skills Marketplace (Module 38)</title>
  <style>
    :root {
      --bg: #050B16; --panel: #101E30; --cyan: #00D9FF;
      --blue: #218BFF; --purple: #9868FF; --green: #25E6A2; --text: #F0F8FF; --muted: #8FA8C8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Inter", system-ui, sans-serif;
      background: radial-gradient(circle at top right, #0D223D, var(--bg) 60%);
      color: var(--text); min-height: 100vh;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 28px; border-bottom: 1px solid rgba(0, 217, 255, 0.2);
      background: rgba(5, 11, 22, 0.85);
    }
    .brand { font-size: 1.15rem; font-weight: 700; color: var(--cyan); letter-spacing: 0.04em; }
    .badge {
      padding: 4px 10px; border-radius: 999px; font-size: 0.78rem;
      border: 1px solid rgba(37, 230, 162, 0.5); color: var(--green);
      background: rgba(37, 230, 162, 0.1);
    }
    main { max-width: 1180px; margin: 24px auto; padding: 0 20px 40px; display: grid; gap: 20px; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    @media (max-width: 800px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
    .kpi { background: #0A182B; padding: 12px; border-radius: 10px; border: 1px solid rgba(0, 217, 255, 0.16); }
    .kpi .label { font-size: 0.75rem; color: var(--muted); }
    .kpi .val { font-size: 1.3rem; font-weight: 700; color: var(--green); margin-top: 4px; }
    .card {
      background: rgba(16, 30, 48, 0.9); border: 1px solid rgba(0, 217, 255, 0.22);
      border-radius: 14px; padding: 18px;
    }
    h2 { margin: 0 0 12px; font-size: 1rem; color: var(--cyan); }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    button {
      background: linear-gradient(135deg, var(--cyan), var(--blue)); color: #04101E;
      border: none; border-radius: 8px; padding: 9px 14px; font-weight: 700; cursor: pointer;
    }
    button.secondary {
      background: rgba(152, 104, 255, 0.2); color: var(--text);
      border: 1px solid rgba(152, 104, 255, 0.5);
    }
    input {
      background: #081424; color: var(--text); border: 1px solid rgba(0, 217, 255, 0.3);
      border-radius: 8px; padding: 9px 12px; flex: 1; min-width: 180px;
    }
    .pkg-list { display: grid; gap: 10px; }
    .pkg-item {
      background: #081424; border: 1px solid rgba(33, 139, 255, 0.3);
      border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    pre {
      background: #071222; border: 1px solid rgba(0, 217, 255, 0.16);
      border-radius: 8px; padding: 12px; font-size: 0.82rem; overflow-x: auto; color: #CFE9FF; max-height: 220px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">JARVIS OS // MODULE 38 — PLUGIN &amp; SKILLS MARKETPLACE</div>
    <span id="ws-badge" class="badge">LOCAL REGISTRY | WS: CONNECTING</span>
  </header>
  <main>
    <div class="kpis">
      <div class="kpi"><div class="label">Catalog Packages</div><div id="kpi-pkgs" class="val">0</div></div>
      <div class="kpi"><div class="label">Installed</div><div id="kpi-inst" class="val">0</div></div>
      <div class="kpi"><div class="label">Enabled</div><div id="kpi-en" class="val">0</div></div>
      <div class="kpi"><div class="label">Audit Events</div><div id="kpi-aud" class="val">0</div></div>
    </div>

    <section class="card">
      <h2>Local Skills &amp; Plugins Catalog</h2>
      <div class="controls">
        <input id="search-input" type="text" placeholder="Filter packages by slug, name, or description..." />
        <button id="btn-pub">Publish Sample Skill</button>
        <button id="btn-refresh" class="secondary">Refresh</button>
      </div>
      <div id="pkg-list" class="pkg-list"></div>
    </section>

    <section class="card">
      <h2>Registry Telemetry</h2>
      <pre id="out-box">Publish or install a JARVIS plugin/skill to inspect SHA-256 verification and audit state.</pre>
    </section>
  </main>

  <script>
    const out = document.getElementById("out-box");

    async function refresh() {
      const q = document.getElementById("search-input").value.trim();
      const url = q ? `/api/v1/marketplace/packages?q=${encodeURIComponent(q)}` : "/api/v1/marketplace/packages";
      const [sRes, pRes] = await Promise.all([fetch("/api/v1/marketplace/status"), fetch(url)]);
      const st = await sRes.json();
      document.getElementById("kpi-pkgs").textContent = st.packages_count;
      document.getElementById("kpi-inst").textContent = st.installed_count;
      document.getElementById("kpi-en").textContent = st.enabled_count;
      document.getElementById("kpi-aud").textContent = st.audit_events_count;

      const list = document.getElementById("pkg-list");
      list.innerHTML = "";
      const data = await pRes.json();
      (data.packages || []).forEach((p) => {
        const div = document.createElement("div");
        div.className = "pkg-item";
        div.innerHTML = `<div><strong>${p.name}</strong> <code>${p.slug}@${p.version}</code> [${p.kind}]<br/><small style="color:#8FA8C8">Perms: ${p.permissions.join(", ") || "none"} | SHA256: ${p.sha256.slice(0, 12)}...</small></div>`;
        const actions = document.createElement("div");
        actions.style.display = "flex";
        actions.style.gap = "8px";
        const btn = document.createElement("button");
        btn.textContent = p.installed ? (p.enabled ? "Disable" : "Enable") : "Install";
        btn.onclick = async () => {
          const r = p.installed
            ? await fetch(`/api/v1/marketplace/packages/${p.package_id}/toggle`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ enabled: !p.enabled })
              })
            : await fetch(`/api/v1/marketplace/packages/${p.package_id}/install`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ expected_sha256: p.sha256, enabled: true })
              });
          out.textContent = JSON.stringify(await r.json(), null, 2);
          refresh();
        };
        actions.appendChild(btn);
        div.appendChild(actions);
        list.appendChild(div);
      });
    }

    document.getElementById("btn-pub").onclick = async () => {
      const ver = `1.0.${Math.floor(Math.random() * 90) + 1}`;
      const r = await fetch("/api/v1/marketplace/packages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          slug: "daily-briefing-skill",
          name: "Daily Briefing Skill",
          version: ver,
          kind: "skill",
          author: "Roshan Sharma",
          description: "Compiles morning system health and calendar summaries.",
          permissions: ["calendar_read", "notifications"],
          manifest_payload: `{"entry":"briefing.py","version":"${ver}"}`
        })
      });
      out.textContent = JSON.stringify(await r.json(), null, 2);
      refresh();
    };

    document.getElementById("btn-refresh").onclick = refresh;
    document.getElementById("search-input").oninput = refresh;

    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/api/v1/marketplace/ws/registry`);
    ws.onopen = () => { document.getElementById("ws-badge").textContent = "LOCAL REGISTRY | WS: LIVE"; };
    ws.onclose = () => { document.getElementById("ws-badge").textContent = "LOCAL REGISTRY | WS: CLOSED"; };
    refresh();
  </script>
</body>
</html>
