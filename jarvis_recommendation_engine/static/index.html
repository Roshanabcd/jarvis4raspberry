<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS OS — Deep Learning Recommendation Engine</title>
  <style>
    :root {
      --bg: #050a12;
      --panel: #0b1320;
      --panel-2: #0f1b2d;
      --border: #173b3a;
      --accent: #00f5d4;
      --accent-2: #10b981;
      --text: #e6f1ff;
      --muted: #8aa4bf;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: radial-gradient(circle at top right, #0b1d2e 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 19, 32, 0.92);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand h1 { margin: 0; font-size: 18px; letter-spacing: 0.6px; color: var(--accent); }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: rgba(0, 245, 212, 0.1);
      color: var(--accent);
    }
    main { max-width: 1180px; margin: 22px auto; padding: 0 20px 40px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab-btn.active {
      background: rgba(0, 245, 212, 0.14);
      color: var(--accent);
      border-color: var(--accent);
    }
    .panel {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .panel.active { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      margin-bottom: 12px;
    }
    button.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #031318;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    .card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
    }
    .score-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .pill {
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-2);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .status { font-size: 13px; color: var(--accent); margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>JARVIS OS // Deep Learning Recommendation Engine</h1>
      <span class="badge">HYBRID 128-D + CF + SGD MF</span>
    </div>
    <div id="healthBadge" class="badge">Loading status...</div>
  </header>

  <main>
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('recommend', this)">Personalized Recommendations</button>
      <button class="tab-btn" onclick="showTab('catalog', this)">Catalog &amp; Embeddings</button>
      <button class="tab-btn" onclick="showTab('interactions', this)">Log Interactions</button>
      <button class="tab-btn" onclick="showTab('similar', this)">Item-to-Item Similarity</button>
    </div>

    <section id="tab-recommend" class="panel active">
      <div class="grid">
        <div>
          <label>User ID</label>
          <input id="recUser" value="roshan" />
        </div>
        <div>
          <label>Top K</label>
          <input id="recTopK" type="number" value="5" min="1" max="50" />
        </div>
        <div>
          <label>Category Filter (optional)</label>
          <input id="recCategory" placeholder="e.g. robotics, ai, tasks" />
        </div>
      </div>
      <button class="primary" onclick="runRecommendations()">Generate Recommendations</button>
      <div id="recStatus" class="status"></div>
      <div id="recResults"></div>
    </section>

    <section id="tab-catalog" class="panel">
      <div class="grid">
        <div>
          <label>Item ID</label>
          <input id="itemId" placeholder="task-ros2-nav" />
        </div>
        <div>
          <label>Title</label>
          <input id="itemTitle" placeholder="ROS2 Autonomous Navigation Tuning" />
        </div>
        <div>
          <label>Category</label>
          <input id="itemCategory" value="robotics" />
        </div>
      </div>
      <label>Tags (comma-separated)</label>
      <input id="itemTags" placeholder="ros2, lidar, raspberry-pi, slam" />
      <label>Description</label>
      <textarea id="itemDesc" rows="3" placeholder="Tune Nav2 costmaps and LiDAR localization on Raspberry Pi 5."></textarea>
      <button class="primary" onclick="saveItem()">Upsert Catalog Item &amp; Compute 128-D Embedding</button>
      <div id="catStatus" class="status"></div>
      <div id="catList"></div>
    </section>

    <section id="tab-interactions" class="panel">
      <div class="grid">
        <div>
          <label>User ID</label>
          <input id="intUser" value="roshan" />
        </div>
        <div>
          <label>Item ID</label>
          <input id="intItem" placeholder="task-ros2-nav" />
        </div>
        <div>
          <label>Event Type</label>
          <select id="intEvent">
            <option value="view">view (1.0)</option>
            <option value="like" selected>like (3.5)</option>
            <option value="bookmark">bookmark (4.0)</option>
            <option value="complete">complete (5.0)</option>
            <option value="dismiss">dismiss (-2.0)</option>
          </select>
        </div>
      </div>
      <button class="primary" onclick="logInteraction()">Record User Interaction</button>
      <div id="intStatus" class="status"></div>
    </section>

    <section id="tab-similar" class="panel">
      <div class="grid">
        <div>
          <label>Source Item ID</label>
          <input id="simItem" placeholder="task-ros2-nav" />
        </div>
        <div>
          <label>Top K</label>
          <input id="simTopK" type="number" value="5" min="1" max="50" />
        </div>
      </div>
      <button class="primary" onclick="findSimilar()">Find Cosine-Similar Items</button>
      <div id="simStatus" class="status"></div>
      <div id="simResults"></div>
    </section>
  </main>

  <script>
    function showTab(name, btn) {
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.getElementById("tab-" + name).classList.add("active");
      btn.classList.add("active");
      if (name === "catalog") loadCatalog();
    }

    async function refreshHealth() {
      try {
        const res = await fetch("/api/recommendations/health");
        const data = await res.json();
        document.getElementById("healthBadge").textContent =
          `OK | ${data.embedding_dim}D | ${data.total_items} items | ${data.total_interactions} events`;
      } catch (e) {
        document.getElementById("healthBadge").textContent = "Backend unreachable";
      }
    }

    async function loadCatalog() {
      const res = await fetch("/api/recommendations/items");
      const data = await res.json();
      const box = document.getElementById("catList");
      box.innerHTML = data.items.map(it => `
        <div class="card">
          <strong>${it.title}</strong> <span class="pill">${it.category}</span>
          <div style="font-size:12px;color:#8aa4bf;margin-top:4px;">ID: ${it.item_id} | Tags: ${it.tags.join(", ") || "none"}</div>
          <div style="margin-top:6px;font-size:13px;">${it.description}</div>
        </div>
      `).join("") || `<div class="card">No catalog items yet.</div>`;
    }

    async function saveItem() {
      const payload = {
        item_id: document.getElementById("itemId").value.trim(),
        title: document.getElementById("itemTitle").value.trim(),
        category: document.getElementById("itemCategory").value.trim() || "general",
        description: document.getElementById("itemDesc").value.trim(),
        tags: document.getElementById("itemTags").value.split(",").map(s => s.trim()).filter(Boolean),
      };
      const res = await fetch("/api/recommendations/items", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      document.getElementById("catStatus").textContent = res.ok
        ? `Saved item '${data.item_id}' with 128-D dense embedding.`
        : `Error: ${data.detail || res.statusText}`;
      refreshHealth();
      loadCatalog();
    }

    async function logInteraction() {
      const payload = {
        user_id: document.getElementById("intUser").value.trim(),
        item_id: document.getElementById("intItem").value.trim(),
        event_type: document.getElementById("intEvent").value,
      };
      const res = await fetch("/api/recommendations/interactions", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      document.getElementById("intStatus").textContent = res.ok
        ? `Logged ${data.event_type} (weight=${data.weight}) for ${data.user_id} -> ${data.item_id}.`
        : `Error: ${data.detail || res.statusText}`;
      refreshHealth();
    }

    async function runRecommendations() {
      const cat = document.getElementById("recCategory").value.trim();
      const payload = {
        user_id: document.getElementById("recUser").value.trim(),
        top_k: Number(document.getElementById("recTopK").value) || 5,
        category_filter: cat || null,
        exclude_interacted: true,
      };
      const res = await fetch("/api/recommendations/recommend", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      document.getElementById("recStatus").textContent = `Strategy: ${data.strategy} (${data.recommendations.length} results)`;
      document.getElementById("recResults").innerHTML = (data.recommendations || []).map(r => `
        <div class="card">
          <strong>${r.title}</strong> <span class="pill">${r.category}</span>
          <div class="score-row">
            <span>Final: <strong>${r.final_score}</strong></span>
            <span>Embedding Cosine: ${r.content_cosine}</span>
            <span>Collab CF: ${r.collaborative_score}</span>
            <span>Latent MF: ${r.latent_mf_score}</span>
          </div>
          <div style="margin-top:6px;font-size:13px;color:#8aa4bf;">${r.reason}</div>
        </div>
      `).join("") || `<div class="card">No recommendations available yet.</div>`;
    }

    async function findSimilar() {
      const id = encodeURIComponent(document.getElementById("simItem").value.trim());
      const topK = Number(document.getElementById("simTopK").value) || 5;
      const res = await fetch(`/api/recommendations/items/${id}/similar?top_k=${topK}`);
      const data = await res.json();
      if (!res.ok) {
        document.getElementById("simStatus").textContent = `Error: ${data.detail || res.statusText}`;
        return;
      }
      document.getElementById("simStatus").textContent = `Found ${data.similar.length} similar items for ${data.source_item_id}.`;
      document.getElementById("simResults").innerHTML = data.similar.map(r => `
        <div class="card">
          <strong>${r.title}</strong> <span class="pill">${r.category}</span>
          <div class="score-row"><span>Cosine Similarity: <strong>${r.content_cosine}</strong></span></div>
          <div style="margin-top:6px;font-size:13px;color:#8aa4bf;">${r.reason}</div>
        </div>
      `).join("");
    }

    refreshHealth();
  </script>
</body>
</html>
