<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS OS — Cross-Device Control Center (Module 37)</title>
  <style>
    :root {
      --bg: #050B16; --panel: #101E30; --cyan: #00D9FF;
      --blue: #218BFF; --purple: #9868FF; --green: #25E6A2; --text: #F0F8FF; --muted: #8FA8C8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Inter", system-ui, sans-serif;
      background: radial-gradient(circle at top right, #0D223D, var(--bg) 60%);
      color: var(--text); min-height: 100vh;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 28px; border-bottom: 1px solid rgba(0, 217, 255, 0.2);
      background: rgba(5, 11, 22, 0.85);
    }
    .brand { font-size: 1.15rem; font-weight: 700; color: var(--cyan); letter-spacing: 0.04em; }
    .badge {
      padding: 4px 10px; border-radius: 999px; font-size: 0.78rem;
      border: 1px solid rgba(152, 104, 255, 0.6); color: var(--purple);
      background: rgba(152, 104, 255, 0.12);
    }
    main { max-width: 1180px; margin: 24px auto; padding: 0 20px 40px; display: grid; gap: 20px; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    @media (max-width: 800px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
    .kpi { background: #0A182B; padding: 12px; border-radius: 10px; border: 1px solid rgba(0, 217, 255, 0.16); }
    .kpi .label { font-size: 0.75rem; color: var(--muted); }
    .kpi .val { font-size: 1.3rem; font-weight: 700; color: var(--green); margin-top: 4px; }
    .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: rgba(16, 30, 48, 0.9); border: 1px solid rgba(0, 217, 255, 0.22);
      border-radius: 14px; padding: 18px;
    }
    h2 { margin: 0 0 12px; font-size: 1rem; color: var(--cyan); }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    button {
      background: linear-gradient(135deg, var(--cyan), var(--blue)); color: #04101E;
      border: none; border-radius: 8px; padding: 9px 14px; font-weight: 700; cursor: pointer;
    }
    button.secondary {
      background: rgba(152, 104, 255, 0.2); color: var(--text);
      border: 1px solid rgba(152, 104, 255, 0.5);
    }
    input {
      background: #081424; color: var(--text); border: 1px solid rgba(0, 217, 255, 0.3);
      border-radius: 8px; padding: 9px 12px; flex: 1; min-width: 180px;
    }
    .device-list { display: grid; gap: 10px; }
    .device-item {
      background: #081424; border: 1px solid rgba(33, 139, 255, 0.3);
      border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center;
    }
    pre {
      background: #071222; border: 1px solid rgba(0, 217, 255, 0.16);
      border-radius: 8px; padding: 12px; font-size: 0.82rem; overflow-x: auto; color: #CFE9FF; max-height: 260px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">JARVIS OS // MODULE 37 — CROSS-DEVICE CONTROL CENTER</div>
    <span id="ws-badge" class="badge">SIMULATED BRIDGE | WS: CONNECTING</span>
  </header>
  <main>
    <div class="kpis">
      <div class="kpi"><div class="label">Mesh Devices</div><div id="kpi-dev" class="val">0</div></div>
      <div class="kpi"><div class="label">Online</div><div id="kpi-online" class="val">0</div></div>
      <div class="kpi"><div class="label">Commands Sent</div><div id="kpi-cmd" class="val">0</div></div>
      <div class="kpi"><div class="label">Clipboard Syncs</div><div id="kpi-clip" class="val">0</div></div>
    </div>

    <div class="grid">
      <section class="card">
        <h2>Registered Mesh Nodes</h2>
        <div class="controls">
          <button id="btn-add">Register Sample Pi 5 Node</button>
          <button id="btn-refresh" class="secondary">Refresh Mesh</button>
        </div>
        <div id="device-list" class="device-list"></div>
      </section>

      <section class="card">
        <h2>Clipboard Sync &amp; Bridge Telemetry</h2>
        <div class="controls">
          <input id="clip-input" type="text" placeholder="Text to sync across mesh..." />
          <button id="btn-clip">Sync Clipboard</button>
        </div>
        <pre id="out-box">Register a device node to dispatch capability-guarded commands or sync clipboard entries.</pre>
      </section>
    </div>
  </main>

  <script>
    let activeDeviceId = null;
    const out = document.getElementById("out-box");

    async function refresh() {
      const [sRes, dRes] = await Promise.all([
        fetch("/api/v1/devices/status"),
        fetch("/api/v1/devices/nodes")
      ]);
      const st = await sRes.json();
      document.getElementById("kpi-dev").textContent = st.devices_count;
      document.getElementById("kpi-online").textContent = st.online_devices_count;
      document.getElementById("kpi-cmd").textContent = st.commands_count;
      document.getElementById("kpi-clip").textContent = st.clipboard_entries_count;

      const list = document.getElementById("device-list");
      list.innerHTML = "";
      const data = await dRes.json();
      (data.devices || []).forEach((d) => {
        if (!activeDeviceId) activeDeviceId = d.device_id;
        const div = document.createElement("div");
        div.className = "device-item";
        div.innerHTML = `<div><strong>${d.name}</strong> (${d.device_type} / ${d.platform})<br/><small style="color:#8FA8C8">Caps: ${d.capabilities.join(", ")} | Battery: ${d.battery_pct}%</small></div>`;
        const btn = document.createElement("button");
        btn.textContent = "Ping Notify";
        btn.onclick = async () => {
          const r = await fetch(`/api/v1/devices/nodes/${d.device_id}/commands`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ capability: "notifications", action: "toast", params: { title: "JARVIS Ping" } })
          });
          out.textContent = JSON.stringify(await r.json(), null, 2);
          refresh();
        };
        div.appendChild(btn);
        list.appendChild(div);
      });
    }

    document.getElementById("btn-add").onclick = async () => {
      const r = await fetch("/api/v1/devices/nodes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: "Roshan-Pi5-Node",
          device_type: "raspberry_pi",
          platform: "linux",
          capabilities: ["clipboard", "media", "notifications", "lock"],
          battery_pct: 100,
          online: true
        })
      });
      const dev = await r.json();
      activeDeviceId = dev.device_id;
      out.textContent = JSON.stringify(dev, null, 2);
      refresh();
    };

    document.getElementById("btn-refresh").onclick = refresh;

    document.getElementById("btn-clip").onclick = async () => {
      if (!activeDeviceId) return;
      const content = document.getElementById("clip-input").value.trim() || "JARVIS Mesh Sync Test";
      const r = await fetch("/api/v1/devices/clipboard", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ source_device_id: activeDeviceId, content })
      });
      out.textContent = JSON.stringify(await r.json(), null, 2);
      refresh();
    };

    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/api/v1/devices/ws/mesh`);
    ws.onopen = () => { document.getElementById("ws-badge").textContent = "SIMULATED BRIDGE | WS: LIVE"; };
    ws.onclose = () => { document.getElementById("ws-badge").textContent = "SIMULATED BRIDGE | WS: CLOSED"; };
    refresh();
  </script>
</body>
</html>
